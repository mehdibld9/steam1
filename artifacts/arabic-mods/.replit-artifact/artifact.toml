kind = "web"
previewPath = "/"
title = "Arabic Game Translations"
version = "1.0.0"
id = "artifacts/arabic-mods"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23146

[services.development]
run = "pnpm --filter @workspace/arabic-mods run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arabic-mods", "run", "build" ]
publicDir = "artifacts/arabic-mods/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23146"
BASE_PATH = "/"
