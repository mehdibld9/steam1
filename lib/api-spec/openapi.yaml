openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Arabic Game Translations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: mods
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /mods:
    get:
      operationId: listMods
      tags: [mods]
      summary: List all mods
      responses:
        "200":
          description: List of mods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mod"
    post:
      operationId: createMod
      tags: [admin]
      summary: Create mod (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mod"
        "401":
          description: Unauthorized

  /mods/{id}:
    get:
      operationId: getMod
      tags: [mods]
      summary: Get a mod
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mod detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mod"
        "404":
          description: Not found
    put:
      operationId: updateMod
      tags: [admin]
      summary: Update mod (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mod"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteMod
      tags: [admin]
      summary: Delete mod (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /mods/{id}/download:
    post:
      operationId: trackDownload
      tags: [mods]
      summary: Increment download count
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated mod
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mod"
        "404":
          description: Not found

  /admin/status:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Check admin setup status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"

  /admin/setup:
    post:
      operationId: setupAdmin
      tags: [admin]
      summary: First-time admin setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAdminBody"
      responses:
        "200":
          description: Setup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerifyResult"
        "409":
          description: Already set up

  /admin/verify:
    post:
      operationId: verifyAdmin
      tags: [admin]
      summary: Verify admin credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAdminBody"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerifyResult"
        "401":
          description: Invalid credentials

  /stats:
    get:
      operationId: getStats
      tags: [mods]
      summary: Site statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"

  /ads:
    get:
      operationId: listAds
      tags: [admin]
      summary: List all ads
      responses:
        "200":
          description: List of ads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ad"
    post:
      operationId: createAd
      tags: [admin]
      summary: Create ad (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
        "401":
          description: Unauthorized

  /ads/{id}:
    put:
      operationId: updateAd
      tags: [admin]
      summary: Update ad (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteAd
      tags: [admin]
      summary: Delete ad (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Mod:
      type: object
      required: [id, title, gameName, downloadCount, viewCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        gameName:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        extraImages:
          type: ["array", "null"]
          items:
            type: string
        downloadCount:
          type: integer
        viewCount:
          type: integer
        download1Label:
          type: ["string", "null"]
        download1Url:
          type: ["string", "null"]
        download2Label:
          type: ["string", "null"]
        download2Url:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ModInput:
      type: object
      required: [title, gameName]
      properties:
        title:
          type: string
          minLength: 1
        gameName:
          type: string
          minLength: 1
        description:
          type: string
        imageUrl:
          type: string
        extraImages:
          type: array
          items:
            type: string
        download1Label:
          type: string
        download1Url:
          type: string
        download2Label:
          type: string
        download2Url:
          type: string

    ModUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        gameName:
          type: string
          minLength: 1
        description:
          type: string
        imageUrl:
          type: string
        extraImages:
          type: array
          items:
            type: string
        download1Label:
          type: string
        download1Url:
          type: string
        download2Label:
          type: string
        download2Url:
          type: string

    AdminStatus:
      type: object
      required: [isSetup]
      properties:
        isSetup:
          type: boolean

    SetupAdminBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 6

    VerifyAdminBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AdminVerifyResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    SiteStats:
      type: object
      required: [totalMods, totalDownloads, totalViews]
      properties:
        totalMods:
          type: integer
        totalDownloads:
          type: integer
        totalViews:
          type: integer

    Ad:
      type: object
      required: [id, imageUrl, linkUrl, position, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: ["string", "null"]
        imageUrl:
          type: string
        linkUrl:
          type: string
        position:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    AdInput:
      type: object
      required: [imageUrl, linkUrl, position]
      properties:
        title:
          type: string
        imageUrl:
          type: string
        linkUrl:
          type: string
        position:
          type: string
          enum: [home, mod_detail]
        isActive:
          type: boolean
